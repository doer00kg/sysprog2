name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -t stm32-build docker/

      - name: Dependency rules, host tests and firmware build
        run: make all
